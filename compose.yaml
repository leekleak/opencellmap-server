services:
  clickhouse:
    image: clickhouse/clickhouse-server
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    volumes: [ch-data:/var/lib/clickhouse]
    healthcheck: { test: ["CMD", "clickhouse-client", "-q", "SELECT 1"] }
  collector:
    build: .
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      clickhouse: { condition: service_healthy }
    ports: ["8080:3000"]
volumes:
  ch-data:
